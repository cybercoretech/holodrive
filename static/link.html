<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>HOLODRIVE · shared</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/vendor/tokens.css">
<link rel="stylesheet" href="/static/ui.css">
<style>
  .link-wrap { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: start center; padding: 6vh 14px 40px; }
  .link-window { width: min(720px, 100%); }
  .link-body { padding: 22px; display: grid; gap: 14px; }
  .link-head { display: flex; align-items: center; gap: 14px; }
  .link-head img { filter: drop-shadow(0 0 12px var(--glow-cyan)); }
  .link-name { font-size: 1.25rem; font-weight: 700; word-break: break-word; }
  .link-meta { color: var(--muted); font-size: 12px; }
  .link-crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
  .link-crumbs button { background: none; border: 0; color: var(--cyan); cursor: pointer; padding: 0; }
  .link-list { display: grid; border: 1px solid var(--line); border-radius: var(--hd-radius); overflow: hidden; }
  .link-row { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .link-row:first-child { border-top: 0; }
  .link-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row button.n { background: none; border: 0; text-align: left; color: var(--fg); cursor: pointer; padding: 0; }
  .link-row button.n:hover { color: var(--cyan); }
  .link-preview { max-width: 100%; max-height: 60vh; border-radius: var(--hd-radius); justify-self: center; }
  .drop-zone { border: 2px dashed color-mix(in srgb, var(--cyan) 55%, var(--line)); border-radius: var(--hd-radius); padding: 34px 16px; text-align: center; cursor: pointer; }
  .drop-zone.over { border-color: var(--pink); box-shadow: 0 0 22px var(--glow-pink); }
  .drop-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 12px; }
  .drop-bar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .drop-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); }
  .link-err { color: var(--red); }
</style>
<script src="/static/link.js" defer></script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-floor" aria-hidden="true"><div class="bg-floor-grid"></div></div>
<div class="bg-scanlines" aria-hidden="true"></div>
<main class="link-wrap">
  <section class="window link-window">
    <div class="titlebar"><span class="dot dot-a"></span><span class="dot dot-b"></span><span class="dot dot-c"></span><span class="titlebar-text">holodrive · shared with you</span></div>
    <div class="link-body" id="body"><div class="muted">opening link…</div></div>
  </section>
</main>
</body>
</html>
